[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "previdenza-complementare"
version = "0.1.0"
description = "Previdenza complementare in Italia: TFR in azienda o fondo pensione, gap della pensione INPS, deducibilità, tassazione 15-9%, rendita o capitale e confronto con un PAC in ETF"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francesco Torraco" }]
keywords = ["previdenza complementare", "fondo pensione", "TFR", "pensione", "INPS", "PAC", "ETF", "Italia"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "plotly>=5.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
png = ["kaleido>=1.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
previdenza-complementare = "previdenza_complementare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
previdenza_complementare = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
